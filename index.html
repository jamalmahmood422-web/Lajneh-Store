<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lajneh Store | متجر لجنة الطب والجراحة</title>
<link rel="icon" href="lajneh-store-logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--cyan:#00AEEF;--cyan-d:#0089bd;--slate:#43525C;--ink:#27333a;--ash:#B3B3B3;--mist:#F2F7FA;--line:#dfe8ed;--r:14px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 16px/1.7 "IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);background:#fff}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;height:68px}
.brand{display:flex;align-items:center;gap:14px}
.brand img:first-child{height:38px}
.brand .div{width:1px;height:30px;background:var(--line)}
.brand img:last-child{height:44px}
.grow{flex:1}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--slate);color:#fff;border:0;border-radius:99px;padding:8px 18px;cursor:pointer;font-weight:500}
.cartbtn b{background:var(--cyan);border-radius:99px;min-width:24px;text-align:center;padding:0 6px;font-size:14px}
.hero{background:var(--slate);color:#fff;padding:56px 0 0;overflow:hidden}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.35;font-weight:700;max-width:640px}
.hero p{color:#cfdbe2;margin:12px 0 26px;max-width:520px}
.search{display:flex;background:#fff;border-radius:99px;padding:5px;max-width:560px}
.search input{flex:1;border:0;background:none;padding:10px 18px;color:var(--ink);min-width:0}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px var(--cyan)}
.search span{display:grid;place-items:center;width:44px;color:var(--slate)}
.pulse{display:block;width:100%;height:70px;margin-top:20px}
.pulse path{fill:none;stroke:var(--cyan);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:22px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer;transition:background .15s,color .15s}
.chip:hover{border-color:var(--cyan)}
.chip[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#fff;font-weight:500}
select{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.count{color:#6b7a83;font-size:14px;padding-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding-bottom:56px}
.card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(67,82,92,.12)}
.thumb{aspect-ratio:4/3;background:#fff;border-bottom:1px solid var(--line);display:grid;place-items:center;font-size:54px;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain;padding:8px}
.tag{position:absolute;top:10px;right:10px;background:#fff;border-radius:99px;font-size:12px;padding:0 10px;color:var(--slate)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{font-size:17px;font-weight:700}
.body p{font-size:14px;color:#62727b;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.price{font-weight:700;color:var(--slate);font-size:18px}
.add{background:var(--cyan);color:#fff;border:0;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:500}
.add:hover{background:var(--cyan-d)}
.add:disabled{background:var(--ash);cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:#6b7a83}
aside{position:fixed;inset:0 auto 0 0;width:min(400px,100%);background:#fff;z-index:40;transform:translateX(-105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(0,0,0,.15)}
aside.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(39,51,58,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
aside header{position:static;display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
aside h2{font-size:20px}
.x{background:none;border:0;font-size:26px;cursor:pointer;line-height:1}
.items{flex:1;overflow:auto;padding:8px 20px}
.it{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it div:first-child{flex:1}
.it small{color:#6b7a83}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.foot{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--mist)}
.foot input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.tot{display:flex;justify-content:space-between;font-weight:700}
.send{background:var(--slate);color:#fff;border:0;border-radius:10px;padding:11px;cursor:pointer;font-weight:700}
.send:hover{background:var(--ink)}
.msg{font-size:14px;min-height:20px}
footer{background:var(--mist);padding:28px 0;color:#62727b;font-size:14px;text-align:center}
@media(max-width:560px){.brand img:first-child{height:30px}.brand img:last-child{height:36px}.cartbtn span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pulse path{stroke-dashoffset:0}}

#splash{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;transition:opacity .6s,visibility .6s}
#splash.done{opacity:0;visibility:hidden}
.sp-icon{width:clamp(84px,22vw,120px);overflow:visible}
.sp-icon *{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sp-h{stroke:var(--slate);stroke-width:4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw1 .6s ease-out forwards}
.sp-b{stroke:var(--slate);stroke-width:3;fill:var(--slate)!important;fill-opacity:0;stroke-dasharray:1;stroke-dashoffset:1;animation:draw1 .9s .3s ease-out forwards,fillin .4s 1.1s forwards}
.sp-p{stroke:var(--cyan);stroke-width:3.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw1 .7s 1.2s ease-out forwards}
@keyframes draw1{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1}}
.sp-t{direction:ltr;font-weight:700;font-size:clamp(30px,9vw,46px);color:var(--slate);white-space:pre;min-height:1.4em;letter-spacing:.5px}
.sp-t b{color:var(--cyan);font-weight:700}
.sp-t i{display:inline-block;width:3px;height:.9em;background:var(--cyan);margin-inline-start:3px;vertical-align:-.1em;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){#splash{display:none}}

.tools{display:block;padding:14px 0 8px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:none}
.chip{min-height:40px;padding:4px 18px;white-space:nowrap}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
.meta .count{padding:0}
.sortl{display:flex;align-items:center;gap:8px;font-size:14px;color:#62727b}
select{min-height:40px;padding:6px 12px;font-size:15px}
@media(max-width:700px){
.tools{position:sticky;top:68px;z-index:15;background:#fff;margin-bottom:14px;padding-top:10px}
.chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:center}
}

.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--slate);color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:35;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(39,51,58,.3)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ok{color:var(--cyan);font-weight:700;font-size:18px}
.toast button{background:var(--cyan);color:#fff;border:0;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.cartbtn b.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.5)}}
.add.done{background:var(--slate)}
</style>
</head>
<body>
<noscript><style>#splash{display:none}</style></noscript>
<div id="splash" role="presentation" aria-hidden="true">
  <svg class="sp-icon" viewBox="0 0 52 64">
    <path class="sp-h" pathLength="1" d="M13 20v-4a9 9 0 0 1 18 0v4"/>
    <rect class="sp-b" pathLength="1" x="2" y="20" width="40" height="38" rx="9"/>
    <polyline class="sp-p" pathLength="1" points="8,40 17,40 22,30 28,50 33,40 36,40"/>
  </svg>
  <div class="sp-t"><span id="t1"></span><b id="t2"></b><i></i></div>
</div>
<header><div class="wrap">
  <a class="brand" href="./" aria-label="Lajneh Store">
    <img src="team-logo.png" alt="شعار لجنة الطب والجراحة"><span class="div"></span>
    <img src="lajneh-store-logo.svg" alt="Lajneh Store">
  </a>
  <span class="grow"></span>
  <button class="cartbtn" id="openCart" aria-label="السلة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.5L21 8H6"/></svg><span>السلة</span><b id="cnt">0</b></button>
</div></header>

<section class="hero"><div class="wrap">
  <h1>أدواتك الطبية، من طلاب الطب إلى طلاب الطب</h1>
  <p>سماعات وأدوات جراحية وتشخيصية بأسعار مناسبة للطلاب، من متجر لجنة الطب والجراحة.</p>
  <label class="search"><input id="q" type="search" placeholder="ابحث عن سماعة، مطرقة، معطف…" aria-label="بحث"><span aria-hidden="true">⌕</span></label>
  <svg class="pulse" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40H430l30-28 40 56 34-28h700"/></svg>
</div></section>

<main class="wrap">
  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
    <div class="meta">
      <div class="count" id="count" role="status"></div>
      <label class="sortl">الترتيب
        <select id="sort"><option value="">الأحدث</option><option value="asc">السعر: الأقل أولاً</option><option value="desc">السعر: الأعلى أولاً</option></select>
      </label>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer>© Lajneh Store · لجنة الطب والجراحة</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim"></div>
<aside id="cart" aria-label="السلة" aria-hidden="true">
  <header><h2>سلتك</h2><button class="x" id="closeCart" aria-label="إغلاق">×</button></header>
  <div class="items" id="items"></div>
  <form class="foot" id="order">
    <div class="tot"><span>المجموع</span><span id="total">0 د.أ</span></div>
    <input name="name" placeholder="الاسم" required autocomplete="name">
    <input name="phone" placeholder="رقم الهاتف" required type="tel" autocomplete="tel">
    <button class="send" type="submit">إرسال الطلب</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// بيانات مشروع Supabase (المفتاح publishable آمن للنشر)
const SUPABASE_URL = "https://oldhmrnvrckwqrxymrsg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_uia6Gci5kBnKlTqvXGELow_J-9tgFE0";

const DEMO = [
 {id:1,name:"سماعة طبية ADC Adscope 608",description:"رأس ستانلس ستيل وأنبوب أسود، مناسبة للفحص السريري",price:45,category:"سماعات",stock:15,image_url:"adscope-stethoscope.jpg"},
 {id:2,name:"سماعة طبية MDF",description:"تصميم أسود كامل بمظهر أنيق",price:60,category:"سماعات",stock:10,image_url:"mdf-stethoscope.jpg"},
 {id:3,name:"سماعة طبية Spirit Original",description:"رأس ستانلس ستيل وأنبوب أسود",price:25,category:"سماعات",stock:20,image_url:"spirit-stethoscope.jpg"},
 {id:4,name:"حقيبة سماعة طبية",description:"حقيبة حماية بسحاب وحزام، بتصميم نبض القلب",price:8,category:"مستلزمات",stock:25,image_url:"stethoscope-case.jpg"},
 {id:5,name:"مطرقة منعكسات",description:"مطرقة معدنية مع فرشاة وإبرة للفحص العصبي",price:6,category:"أدوات تشخيص",stock:30,image_url:"reflex-hammer.jpg"},
 {id:6,name:"متر قياس",description:"متر قابل للسحب بألوان متعددة",price:1.5,category:"مستلزمات",stock:60,image_url:"tape-measure.jpg"},
 {id:7,name:"تاغ نيم",description:"تاغ مطبوع بالاسم والجامعة حسب الطلب",price:3,category:"مستلزمات",stock:100,image_url:"name-tag.jpg"},
 {id:8,name:"عدة خياطة تدريبية STK-168",description:"قاعدة خياطة وأدوات وخيوط وشفرات وحقيبة حمل",price:25,category:"أدوات جراحية",stock:12,image_url:"suture-kit.jpg"},
 {id:9,name:"كتاب Macleod's Clinical Examination",description:"الطبعة 15، النسخة الدولية (International Edition)",price:30,category:"كتب",stock:8,image_url:"macleods-book.jpg"}
];
const ICONS={"سماعات":"🩺","أدوات جراحية":"✂️","أدوات تشخيص":"🔬","كتب":"📘","مستلزمات":"🎒"};
const $=s=>document.querySelector(s);
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let products=[],cat="الكل",cart=JSON.parse(localStorage.getItem("lajneh-cart")||"{}");
const money=n=>(+n).toLocaleString("ar-JO",{maximumFractionDigits:2})+" د.أ";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(){
  if(sb){const {data,error}=await sb.from("products").select("*").eq("active",true).order("id",{ascending:false});
    products=error?DEMO:data}
  else products=DEMO;
  renderChips();render();renderCart();
}
function renderChips(){
  const cats=["الكل",...new Set(products.map(p=>p.category))];
  $("#chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
function render(){
  const q=$("#q").value.trim().toLowerCase(),s=$("#sort").value;
  let list=products.filter(p=>(cat==="الكل"||p.category===cat)&&(p.name+" "+(p.description||"")).toLowerCase().includes(q));
  if(s)list.sort((a,b)=>s==="asc"?a.price-b.price:b.price-a.price);
  $("#count").textContent=list.length+" منتج";
  $("#grid").innerHTML=list.length?list.map(p=>`<article class="card">
    <div class="thumb">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:(p.icon||ICONS[p.category]||"🩺")}<span class="tag">${esc(p.category)}</span></div>
    <div class="body"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>
    <div class="row"><span class="price">${money(p.price)}</span><button class="add" data-id="${p.id}" ${p.stock>0?"":"disabled"}>${p.stock>0?"أضف للسلة":"نفدت الكمية"}</button></div></div></article>`).join("")
    :`<div class="empty">لا توجد نتائج. جرّب كلمة أخرى أو اختر "الكل".</div>`;
}
function save(){localStorage.setItem("lajneh-cart",JSON.stringify(cart));renderCart()}
function renderCart(){
  const rows=Object.entries(cart).map(([id,q])=>({p:products.find(x=>x.id==id),q})).filter(r=>r.p);
  $("#cnt").textContent=rows.reduce((a,r)=>a+r.q,0);
  $("#total").textContent=money(rows.reduce((a,r)=>a+r.q*r.p.price,0));
  $("#items").innerHTML=rows.length?rows.map(({p,q})=>`<div class="it"><div>${esc(p.name)}<br><small>${money(p.price)}</small></div>
    <div class="qty"><button data-d="-1" data-id="${p.id}" aria-label="إنقاص">−</button><span>${q}</span><button data-d="1" data-id="${p.id}" aria-label="زيادة">+</button></div></div>`).join("")
    :`<p class="empty" style="padding:40px 0">سلتك فارغة. أضف منتجاً لتبدأ.</p>`;
}
function toggle(o){if(o)$("#toast").classList.remove("show");$("#cart").classList.toggle("open",o);$("#scrim").classList.toggle("open",o);$("#cart").setAttribute("aria-hidden",!o)}
$("#chips").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;renderChips();render();const a=document.querySelector("#chips [aria-pressed=true]");if(a)a.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})}};
$("#q").oninput=render;$("#sort").onchange=render;
let tt;
function toast(html){const t=$("#toast");t.innerHTML=html;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3000)}
$("#toast").onclick=e=>{if(e.target.id==="toastCart")toggle(true)};
$("#grid").onclick=e=>{
  const btn=e.target.closest(".add");if(!btn||btn.disabled)return;
  const id=btn.dataset.id,p=products.find(x=>x.id==id);if(!p)return;
  if((cart[id]||0)>=p.stock){toast(`<span>وصلت للحد الأقصى المتاح من ${esc(p.name)}</span>`);return}
  cart[id]=(cart[id]||0)+1;save();
  const b=$("#cnt");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");
  btn.textContent="✓ تمت الإضافة";btn.classList.add("done");
  setTimeout(()=>{btn.textContent="أضف للسلة";btn.classList.remove("done")},1200);
  toast(`<span class="ok">✓</span><span>${esc(p.name)}: تمت الإضافة للسلة</span><button id="toastCart">عرض السلة</button>`);
};
$("#items").onclick=e=>{const id=e.target.dataset.id,d=+e.target.dataset.d;if(id){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save()}};
$("#openCart").onclick=()=>toggle(true);$("#closeCart").onclick=$("#scrim").onclick=()=>toggle(false);
document.onkeydown=e=>{if(e.key==="Escape")toggle(false)};
$("#order").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target),msg=$("#msg");
  const items=Object.entries(cart).map(([id,q])=>{const p=products.find(x=>x.id==id);return p&&{id:p.id,name:p.name,price:p.price,qty:q}}).filter(Boolean);
  if(!items.length){msg.textContent="أضف منتجاً واحداً على الأقل قبل الإرسال.";return}
  const total=items.reduce((a,i)=>a+i.price*i.qty,0);
  if(!sb){msg.textContent="وضع تجريبي: اربط Supabase ليُحفظ الطلب.";return}
  const {error}=await sb.from("orders").insert({customer_name:f.get("name"),phone:f.get("phone"),items,total});
  if(error){msg.textContent="تعذّر إرسال الطلب. حاول مرة أخرى.";return}
  cart={};save();e.target.reset();msg.textContent="تم إرسال الطلب. سنتواصل معك قريباً.";
};
load();
</script>
<script>
(function(){
  var s=document.getElementById("splash");if(!s)return;
  var seen=false;try{seen=sessionStorage.getItem("lj-splash")}catch(e){}
  if(seen||matchMedia("(prefers-reduced-motion: reduce)").matches){s.remove();return}
  document.body.style.overflow="hidden";
  var full="Lajneh Store",t1=document.getElementById("t1"),t2=document.getElementById("t2"),i=0,closed=false;
  function close(){if(closed)return;closed=true;s.classList.add("done");document.body.style.overflow="";
    try{sessionStorage.setItem("lj-splash","1")}catch(e){}setTimeout(function(){s.remove()},700)}
  function type(){i++;t1.textContent=full.slice(0,Math.min(i,6));t2.textContent=i>6?full.slice(6,i):"";
    if(i<full.length)setTimeout(type,110);else setTimeout(close,900)}
  setTimeout(type,1300);
